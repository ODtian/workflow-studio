[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-studio"
version = "0.1.0"
description = "Workflow Studio notebook launcher"
requires-python = ">=3.10"
dependencies = [
    "anywidget>=0.9.18", "cryptography", "Pillow>=10", "Jinja2", "python-dotenv",
    "google-api-python-client", "google-auth-oauthlib", "pydata-google-auth",
]

[tool.setuptools]
py-modules = ["studio_entry"]
